name: Apply UI Utils fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply UI Utils fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch UI Utils
        shell: python
        run: |
          from pathlib import Path

          root = Path('src/main/java/net/minecraft/client/gui/uiutils')

          # 1) Add a real Macro entry to the existing UiUtils panel.
          p = root / 'UiUtils.java'
          s = p.read_text()
          old = '            "Fabricate Packet",\n            "Copy GUI Title JSON"\n'
          new = '            "Fabricate Packet",\n            "Copy GUI Title JSON",\n            "Macros"\n'
          if old in s and '"Macros"' not in s:
              s = s.replace(old, new, 1)
              old_case = '''            case 7:\n                copyGuiTitleJson(screen);\n                break;\n'''
              new_case = old_case + '''\n            case 8:\n                if (screen.mc != null) {\n                    screen.mc.displayGuiScreen(\n                            new UiUtilsMacroScreen(screen)\n                    );\n                }\n                break;\n'''
              if old_case in s:
                  s = s.replace(old_case, new_case, 1)
              p.write_text(s)

          # 2) Extend PacketManager with CLIENTBOUND discovery/selection.
          p = root / 'UiUtilsPacketManager.java'
          s = p.read_text()
          marker = '''    public static List<Class<? extends IPacket<?>>>\n    getAllPacketClasses() {\n\n        return ProtocolType.PLAY.getPacketClasses(\n                PacketDirection.SERVERBOUND\n        );\n    }\n'''
          replacement = '''    public static List<Class<? extends IPacket<?>>>\n    getAllPacketClasses() {\n        return getAllPacketClasses(PacketDirection.SERVERBOUND);\n    }\n\n    /**\n     * Returns every PLAY packet registered for the requested direction.\n     */\n    public static List<Class<? extends IPacket<?>>>\n    getAllPacketClasses(PacketDirection direction) {\n        return ProtocolType.PLAY.getPacketClasses(direction);\n    }\n\n    /**\n     * Returns every PLAY CLIENTBOUND packet. These are the packets sent\n     * by the server to the client and were previously missing from the\n     * Delay Packets UI.\n     */\n    public static String[] getAllClientboundPacketTypes() {\n        List<Class<? extends IPacket<?>>> packetClasses =\n                getAllPacketClasses(PacketDirection.CLIENTBOUND);\n\n        String[] result = new String[packetClasses.size()];\n        for (int i = 0; i < packetClasses.size(); ++i) {\n            result[i] = packetClasses.get(i).getSimpleName();\n        }\n        return result;\n    }\n\n    public static String[] getAllPacketTypes(PacketDirection direction) {\n        List<Class<? extends IPacket<?>>> packetClasses =\n                getAllPacketClasses(direction);\n        String[] result = new String[packetClasses.size()];\n        for (int i = 0; i < packetClasses.size(); ++i) {\n            result[i] = packetClasses.get(i).getSimpleName();\n        }\n        return result;\n    }\n'''
          if marker in s and 'getAllClientboundPacketTypes' not in s:
              s = s.replace(marker, replacement, 1)

          # Direction-aware lookup/selection while preserving existing API.
          s = s.replace('''        List<Class<? extends IPacket<?>>> packetClasses =\n                getAllPacketClasses();\n\n        for (\n                Class<? extends IPacket<?>> packetClass\n                        : packetClasses\n''', '''        return findPacketClass(packetName, PacketDirection.SERVERBOUND);\n    }\n\n    private static Class<?> findPacketClass(\n            String packetName, PacketDirection direction\n    ) {\n        if (packetName == null) {\n            return null;\n        }\n\n        List<Class<? extends IPacket<?>>> packetClasses =\n                getAllPacketClasses(direction);\n\n        for (Class<? extends IPacket<?>> packetClass : packetClasses\n''', 1)
          # The replacement above leaves the original method body tail intact.
          p.write_text(s)

          # 3) Make the packet settings screen switch between both directions.
          p = root / 'UiUtilsPacketSettingsScreen.java'
          s = p.read_text()
          if 'private PacketDirection packetDirection' not in s:
              s = s.replace('import net.minecraft.client.gui.screen.Screen;\n', 'import net.minecraft.client.gui.screen.Screen;\nimport net.minecraft.network.PacketDirection;\n', 1)
              s = s.replace('    private int scrollOffset = 0;\n', '    private int scrollOffset = 0;\n\n    private PacketDirection packetDirection = PacketDirection.SERVERBOUND;\n', 1)
              s = s.replace('''        String[] allPackets =\n                UiUtilsPacketManager\n                        .getAllPacketTypes();\n''', '''        String[] allPackets =\n                UiUtilsPacketManager\n                        .getAllPacketTypes(packetDirection);\n''', 1)
              s = s.replace('''                            UiUtilsPacketManager\n                            .togglePacketDelayed(\n                                    packets[i]\n                            );\n''', '''                            UiUtilsPacketManager\n                            .togglePacketDelayed(\n                                    packets[i],\n                                    packetDirection\n                            );\n''', 1)
              s = s.replace('''                UiUtilsPacketManager\n                        .delayAllPackets();\n''', '''                UiUtilsPacketManager\n                        .delayAllPackets(packetDirection);\n''', 1)
              s = s.replace('''            "UI Utils Packet Delay Settings",\n''', '''            "UI Utils Packet Delay Settings",\n''', 1)
              # Add a direction button beside the existing Delay All/Clear All controls.
              needle = '''            /*\n             * Clear All\n             */\n'''
              insert = '''            /*\n             * Direction selector\n             */\n            if (\n                    isInside(\n                            mouseX,\n                            mouseY,\n                            left + 226,\n                            8,\n                            104,\n                            22\n                    )\n            ) {\n                packetDirection =\n                        packetDirection == PacketDirection.SERVERBOUND\n                                ? PacketDirection.CLIENTBOUND\n                                : PacketDirection.SERVERBOUND;\n                scrollOffset = 0;\n                return true;\n            }\n\n'''
              if needle in s:
                  s = s.replace(needle, insert + needle, 1)
              needle = '''        /*\n         * --------------------------------------------------------\n         * Clear All button\n         * --------------------------------------------------------\n         */\n'''
              insert = '''        /*\n         * --------------------------------------------------------\n         * Direction button\n         * --------------------------------------------------------\n         */\n        drawButton(\n                left + 226,\n                8,\n                104,\n                22,\n                packetDirection == PacketDirection.SERVERBOUND\n                        ? "C -> S"\n                        : "S -> C",\n                mouseX,\n                mouseY\n        );\n\n'''
              if needle in s:
                  s = s.replace(needle, insert + needle, 1)
              s = s.replace('''                "Search packets:",\n''', '''                packetDirection == PacketDirection.SERVERBOUND\n                        ? "Client -> Server packets:"\n                        : "Server -> Client packets:",\n''', 1)
              p.write_text(s)

          # 4) Make the fabricator visibly honest about what it currently fabricates.
          #    It remains functional, but no longer presents itself as a generic packet
          #    editor when it only supports two inventory packets.
          p = root / 'UiUtilsFabricatePacketScreen.java'
          s = p.read_text()
          s = s.replace('super(new StringTextComponent("Fabricate Packet"));', 'super(new StringTextComponent("Fabricate Inventory Packet"));', 1)
          s = s.replace('''                "Fabricate Packet",\n''', '''                "Fabricate Inventory Packet",\n''')
          p.write_text(s)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/net/minecraft/client/gui/uiutils
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Apply UI Utils fixes"
          git push
