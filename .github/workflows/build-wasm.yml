name: Build Eaglercraft WASM

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # PREPARE
      # ============================================================

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build full WASM client
        id: wasm_build
        shell: bash
        run: |
          # ========================================================
          # IMPORTANT
          # ========================================================
          # Do NOT stop this script when Gradle fails.
          # We need to collect as much diagnostic information as
          # possible before returning Gradle's actual exit code.
          # ========================================================

          set +e

          # ========================================================
          # FILES
          # ========================================================

          rm -f reports/report.txt
          rm -f reports/build.log
          mkdir -p reports

          REPORT="reports/report.txt"
          LOG="reports/build.log"

          # ========================================================
          # BASIC INFORMATION
          # ========================================================

          {
            echo "################################################################"
            echo "# EAGLERCRAFT WASM BUILD - COMPLETE DIAGNOSTIC REPORT"
            echo "################################################################"
            echo
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "================================================================"
            echo "GITHUB ACTIONS INFORMATION"
            echo "================================================================"
            echo
            echo "Repository:          $GITHUB_REPOSITORY"
            echo "Repository Owner:    $GITHUB_REPOSITORY_OWNER"
            echo "Repository Name:     $GITHUB_REPOSITORY"
            echo "Commit SHA:          $GITHUB_SHA"
            echo "Branch:              $GITHUB_REF_NAME"
            echo "Git Ref:             $GITHUB_REF"
            echo "Event:               $GITHUB_EVENT_NAME"
            echo "Workflow:            $GITHUB_WORKFLOW"
            echo "Workflow Run ID:     $GITHUB_RUN_ID"
            echo "Workflow Run Number: $GITHUB_RUN_NUMBER"
            echo "Job:                 $GITHUB_JOB"
            echo "Actor:               $GITHUB_ACTOR"
            echo "Runner OS:           $RUNNER_OS"
            echo "Runner Architecture: $RUNNER_ARCH"
            echo "Runner Name:         $RUNNER_NAME"
            echo "Workspace:           $GITHUB_WORKSPACE"
            echo
            echo "================================================================"
            echo "BUILD INFORMATION"
            echo "================================================================"
            echo
            echo "Build command:"
            echo "  ./gradlew makeMainWasmClientBundle"
            echo
            echo "Working directory:"
            pwd
            echo
          } > "$REPORT"

          # ========================================================
          # OPERATING SYSTEM
          # ========================================================

          {
            echo "================================================================"
            echo "OPERATING SYSTEM"
            echo "================================================================"
            echo

            echo "--- /etc/os-release ---"
            cat /etc/os-release 2>&1 || true

            echo
            echo "--- uname ---"
            uname -a 2>&1 || true

            echo
            echo "--- hostname ---"
            hostname 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # CPU
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "CPU INFORMATION"
            echo "================================================================"
            echo

            echo "--- nproc ---"
            nproc 2>&1 || true

            echo
            echo "--- lscpu ---"
            lscpu 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # MEMORY
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "MEMORY INFORMATION"
            echo "================================================================"
            echo

            echo "--- free -h ---"
            free -h 2>&1 || true

            echo
            echo "--- /proc/meminfo ---"
            cat /proc/meminfo 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # DISK
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "DISK INFORMATION"
            echo "================================================================"
            echo

            echo "--- df -h ---"
            df -h 2>&1 || true

            echo
            echo "--- df -i ---"
            df -i 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # JAVA
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "JAVA INFORMATION"
            echo "================================================================"
            echo

            echo "--- java -version ---"
            java -version 2>&1 || true

            echo
            echo "--- javac -version ---"
            javac -version 2>&1 || true

            echo
            echo "--- JAVA_HOME ---"
            echo "${JAVA_HOME:-NOT SET}"

            echo
            echo "--- Java properties ---"
            java -XshowSettings:properties -version 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # GRADLE
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "GRADLE INFORMATION"
            echo "================================================================"
            echo

            echo "--- Gradle version ---"
            ./gradlew --version 2>&1 || true

            echo
            echo "--- Gradle wrapper ---"
            ls -lah ./gradlew 2>&1 || true

            echo
            echo "--- gradle-wrapper.properties ---"

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              cat gradle/wrapper/gradle-wrapper.properties 2>&1 || true
            else
              echo "gradle-wrapper.properties not found."
            fi

          } >> "$REPORT"

          # ========================================================
          # GIT
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "GIT INFORMATION"
            echo "================================================================"
            echo

            echo "--- git version ---"
            git --version 2>&1 || true

            echo
            echo "--- git status ---"
            git status --short --branch 2>&1 || true

            echo
            echo "--- git log ---"
            git log -10 --oneline --decorate 2>&1 || true

            echo
            echo "--- current commit ---"
            git rev-parse HEAD 2>&1 || true

            echo
            echo "--- remote ---"
            git remote -v 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # PROJECT STRUCTURE
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "PROJECT STRUCTURE"
            echo "================================================================"
            echo

            echo "--- Top-level files ---"
            find . -maxdepth 2 -type f \
              ! -path './.git/*' \
              ! -path './target_teavm_wasm_gc/javascript_dist/*' \
              | sort 2>&1 || true

            echo
            echo "--- Gradle files ---"
            find . -type f \
              \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
              ! -path './.git/*' \
              | sort 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # ENVIRONMENT
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "RELEVANT ENVIRONMENT VARIABLES"
            echo "================================================================"
            echo

            env | sort | grep -E \
              '^(JAVA|JDK|GRADLE|JAVA_TOOL_OPTIONS|_JAVA_OPTIONS|CI|GITHUB|RUNNER|PATH|HOME|USER|SHELL|LANG|LC_)' \
              2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # GRADLE DAEMON / PROCESSES BEFORE BUILD
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "PROCESSES BEFORE BUILD"
            echo "================================================================"
            echo

            ps auxww 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # BUILD START
          # ========================================================

          {
            echo
            echo "################################################################"
            echo "# STARTING GRADLE BUILD"
            echo "################################################################"
            echo
            echo "Start time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Command:"
            echo "./gradlew makeMainWasmClientBundle"
            echo
            echo "================================================================"
            echo "FULL GRADLE OUTPUT"
            echo "================================================================"
            echo
          } >> "$REPORT"

          echo "Running Gradle build..."

          # ========================================================
          # RUN BUILD
          # ========================================================

          ./gradlew \
            makeMainWasmClientBundle \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG"

          BUILD_EXIT=${PIPESTATUS[0]}

          # ========================================================
          # APPEND COMPLETE BUILD LOG
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "END OF GRADLE OUTPUT"
            echo "================================================================"
            echo
          } >> "$REPORT"

          # ========================================================
          # BUILD RESULT
          # ========================================================

          {
            echo
            echo "################################################################"
            echo "# BUILD RESULT"
            echo "################################################################"
            echo
            echo "Exit code: $BUILD_EXIT"
            echo

            if [ "$BUILD_EXIT" -eq 0 ]; then
              echo "RESULT: SUCCESS"
            else
              echo "RESULT: FAILED"
            fi

            echo
            echo "Build finished:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'

          } >> "$REPORT"

          # ========================================================
          # FAILURE DIAGNOSTICS
          # ========================================================

          if [ "$BUILD_EXIT" -ne 0 ]; then

            {
              echo
              echo "################################################################"
              echo "# FAILURE DIAGNOSTICS"
              echo "################################################################"
              echo

              echo "================================================================"
              echo "LAST 500 LINES OF GRADLE OUTPUT"
              echo "================================================================"
              echo

              tail -n 500 "$LOG" 2>&1 || true

              echo
              echo "================================================================"
              echo "ALL LINES CONTAINING ERROR / EXCEPTION INFORMATION"
              echo "================================================================"
              echo

              grep -Ein \
                'error|exception|caused by|failure|failed|fatal|panic|outofmemory|stackoverflow|assertion|runtimeexception|illegalstateexception|illegalargumentexception|nullpointerexception|execution failed|what went wrong|build failed' \
                "$LOG" \
                2>&1 || true

              echo
              echo "================================================================"
              echo "GRADLE FAILURE SECTION"
              echo "================================================================"
              echo

              grep -n -B 20 -A 100 \
                'FAILURE: Build failed with an exception' \
                "$LOG" \
                2>&1 || true

              echo
              echo "================================================================"
              echo "JAVA EXCEPTION STACK TRACES"
              echo "================================================================"
              echo

              grep -n -B 5 -A 50 \
                -E '(^|[[:space:]])(Caused by:|[A-Za-z0-9_.]+Exception:|[A-Za-z0-9_.]+Error:)' \
                "$LOG" \
                2>&1 || true

            } >> "$REPORT"

          fi

          # ========================================================
          # POST-BUILD PROCESSES
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "PROCESSES AFTER BUILD"
            echo "================================================================"
            echo

            ps auxww 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # GENERATED OUTPUT
          # ========================================================

          {
            echo
            echo "################################################################"
            echo "# GENERATED WASM OUTPUT"
            echo "################################################################"
            echo

          } >> "$REPORT"

          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then

            {
              echo "Output directory EXISTS."
              echo
              echo "Path:"
              realpath target_teavm_wasm_gc/javascript_dist 2>&1 || true

              echo
              echo "================================================================"
              echo "DIRECTORY LISTING"
              echo "================================================================"
              echo

              find target_teavm_wasm_gc/javascript_dist \
                -type f \
                -printf '%p\n' \
                | sort 2>&1 || true

              echo
              echo "================================================================"
              echo "FILE DETAILS"
              echo "================================================================"
              echo

              find target_teavm_wasm_gc/javascript_dist \
                -type f \
                -printf '%p | %s bytes | modified %TY-%Tm-%Td %TH:%TM:%TS\n' \
                | sort 2>&1 || true

              ARTIFACT_COUNT=$(find target_teavm_wasm_gc/javascript_dist -type f | wc -l)

              TOTAL_SIZE=$(du -sh target_teavm_wasm_gc/javascript_dist 2>/dev/null | awk '{print $1}')

              echo
              echo "Total files: $ARTIFACT_COUNT"
              echo "Total size:  $TOTAL_SIZE"

            } >> "$REPORT"

          else

            {
              echo "Output directory DOES NOT EXIST."
              echo
              echo "Expected:"
              echo "target_teavm_wasm_gc/javascript_dist"

            } >> "$REPORT"

          fi

          # ========================================================
          # IMPORTANT BUILD DIRECTORIES
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "TEAVM / BUILD DIRECTORY INFORMATION"
            echo "================================================================"
            echo

            for DIR in \
              "target_teavm_wasm_gc" \
              "target_teavm_wasm_gc/build" \
              "target_teavm_wasm_gc/javascript_dist" \
              "build" \
              ".gradle"; do

              if [ -e "$DIR" ]; then
                echo
                echo "--- $DIR ---"
                du -sh "$DIR" 2>&1 || true
                ls -lah "$DIR" 2>&1 || true
              else
                echo
                echo "--- $DIR ---"
                echo "Does not exist."
              fi

            done

          } >> "$REPORT"

          # ========================================================
          # DISK AFTER BUILD
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "DISK SPACE AFTER BUILD"
            echo "================================================================"
            echo

            df -h 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # GIT STATUS AFTER BUILD
          # ========================================================

          {
            echo
            echo "================================================================"
            echo "GIT STATUS AFTER BUILD"
            echo "================================================================"
            echo

            git status --short 2>&1 || true

          } >> "$REPORT"

          # ========================================================
          # FINAL INFORMATION
          # ========================================================

          {
            echo
            echo "################################################################"
            echo "# COMPLETE BUILD REPORT"
            echo "################################################################"
            echo
            echo "Build exit code: $BUILD_EXIT"
            echo
            echo "Finished:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'
            echo
            echo "Full raw Gradle output:"
            echo "reports/build.log"
            echo
            echo "################################################################"

          } >> "$REPORT"

          # ========================================================
          # PRINT REPORT
          # ========================================================

          echo
          echo "################################################################"
          echo "# BUILD REPORT"
          echo "################################################################"

          cat "$REPORT"

          echo
          echo "################################################################"

          # Save exit code for later steps.
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          # Preserve actual Gradle exit code.
          exit "$BUILD_EXIT"

      # ============================================================
      # UPLOAD WASM AS GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: Upload WASM build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-wasm-build-${{ github.sha }}
          path: target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # UPLOAD COMPLETE DIAGNOSTICS
      # ============================================================

      - name: Upload complete build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build-diagnostics-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT REPORT + WASM TO REPOSITORY
      # ============================================================

      - name: Commit report and WASM artifacts to repository
        if: always()
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Preparing generated files for commit..."

          # --------------------------------------------------------
          # Add report.
          # --------------------------------------------------------

          git add reports/report.txt

          # --------------------------------------------------------
          # Add WASM output.
          # --------------------------------------------------------

          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then
            git add -f target_teavm_wasm_gc/javascript_dist/
          fi

          # --------------------------------------------------------
          # Show what will be committed.
          # --------------------------------------------------------

          echo
          echo "================================================================"
          echo "FILES TO BE COMMITTED"
          echo "================================================================"
          echo

          git status --short

          # --------------------------------------------------------
          # Check for changes.
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo
            echo "No generated files changed."
            echo "Nothing to commit."

          else

            echo
            echo "Changes detected."
            echo

            git diff --cached --stat

            echo
            echo "Creating commit..."

            git commit -m "Update WASM build artifacts [skip ci]"

            COMMIT_EXIT=$?

            if [ "$COMMIT_EXIT" -ne 0 ]; then
              echo "ERROR: git commit failed."
              exit "$COMMIT_EXIT"
            fi

            echo
            echo "Pushing generated files back to repository..."

            git push

            PUSH_EXIT=$?

            if [ "$PUSH_EXIT" -ne 0 ]; then
              echo "ERROR: git push failed."
              exit "$PUSH_EXIT"
            fi

            echo
            echo "Repository update complete."

          fi

      # ============================================================
      # FINAL JOB SUMMARY
      # ============================================================

      - name: Write GitHub Actions job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Eaglercraft WASM Build"
            echo
            echo "## Build"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo
            echo "## Generated Output"
            echo

            if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then

              echo "WASM output directory exists."
              echo
              echo "\`target_teavm_wasm_gc/javascript_dist/\`"
              echo
              echo "### Files"
              echo

              find target_teavm_wasm_gc/javascript_dist \
                -type f \
                -printf -- '- \`%p\` (%s bytes)\n' \
                | sort

            else

              echo "No WASM output directory was created."

            fi

            echo
            echo "## Diagnostic Files"
            echo
            echo "- \`reports/report.txt\`"
            echo "- \`reports/build.log\`"

          } >> "$GITHUB_STEP_SUMMARY"