name: Build Eaglercraft WASM

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # PREPARE GRADLE
      # ============================================================

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x ./gradlew

      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare WASM build directories
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing WASM build directories"
          echo "========================================"

          mkdir -p target_teavm_wasm_gc/javascript_dist
          mkdir -p reports
          mkdir -p Extras/artifacts
          mkdir -p Extras/errors

          echo
          echo "Repository root:"
          pwd

          echo
          echo "WASM directory:"
          ls -lah target_teavm_wasm_gc || true

          echo
          echo "WASM JavaScript directory:"
          ls -lah target_teavm_wasm_gc/javascript || true

          echo
          echo "WASM distribution directory:"
          ls -lah target_teavm_wasm_gc/javascript_dist || true

      # ============================================================
      # COMPILE BOOTSTRAP.JS
      #
      # Equivalent to:
      #
      #   compilebootstrapjs.sh
      #
      # Uses:
      #
      #   java -jar buildtools/closure-compiler.jar
      # ============================================================

      - name: Compile WASM GC bootstrap.js
        id: bootstrap_build
        shell: bash
        run: |
          set +e

          mkdir -p reports

          BOOTSTRAP_LOG="reports/bootstrap-build.log"

          echo "========================================"
          echo "Compile WASM GC Bootstrap JS"
          echo "========================================"

          echo
          echo "Current directory:"
          pwd

          SRC_FOLDER="../src/wasm-gc-teavm-bootstrap/js"
          COMPILER="buildtools/closure-compiler.jar"
          OUTPUT_FILE="javascript_dist/bootstrap.js"

          echo
          echo "Source folder:"
          echo "$SRC_FOLDER"

          echo
          echo "Compiler:"
          echo "$COMPILER"

          echo
          echo "Output:"
          echo "$OUTPUT_FILE"

          {
            echo "========================================"
            echo "WASM GC Bootstrap Build"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit:     $GITHUB_SHA"
            echo "Branch:     $GITHUB_REF_NAME"
            echo "Run ID:     $GITHUB_RUN_ID"
            echo "Started:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
          } > "$BOOTSTRAP_LOG"

          # --------------------------------------------------------
          # Move into target_teavm_wasm_gc
          # --------------------------------------------------------

          cd target_teavm_wasm_gc

          echo "Changed directory to:"
          pwd

          {
            echo "Working directory:"
            pwd
            echo
          } >> "../$BOOTSTRAP_LOG"

          # --------------------------------------------------------
          # Verify Closure Compiler
          # --------------------------------------------------------

          if [ ! -f "$COMPILER" ]; then

            {
              echo "ERROR: Closure Compiler was not found."
              echo
              echo "Expected:"
              echo "$(pwd)/$COMPILER"
              echo
              echo "Files matching closure compiler:"
              find .. \
                -type f \
                \( -iname "*closure*compiler*.jar" -o -iname "closure-compiler.jar" \) \
                -print || true
            } | tee -a "../$BOOTSTRAP_LOG"

            exit 1
          fi

          # --------------------------------------------------------
          # Verify externs.js
          # --------------------------------------------------------

          if [ ! -f "$SRC_FOLDER/externs.js" ]; then

            {
              echo "ERROR: externs.js was not found."
              echo
              echo "Expected:"
              echo "$(pwd)/$SRC_FOLDER/externs.js"
            } | tee -a "../$BOOTSTRAP_LOG"

            exit 1
          fi

          # --------------------------------------------------------
          # Verify main.js
          # --------------------------------------------------------

          if [ ! -f "$SRC_FOLDER/main.js" ]; then

            {
              echo "ERROR: main.js was not found."
              echo
              echo "Expected:"
              echo "$(pwd)/$SRC_FOLDER/main.js"
            } | tee -a "../$BOOTSTRAP_LOG"

            exit 1
          fi

          mkdir -p javascript_dist

          echo
          echo "Input files:"
          ls -lh "$SRC_FOLDER/externs.js"
          ls -lh "$SRC_FOLDER/main.js"

          echo
          echo "Closure Compiler:"
          ls -lh "$COMPILER"

          # --------------------------------------------------------
          # Run Closure Compiler
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "Running Closure Compiler"
          echo "========================================"

          java -jar "$COMPILER" \
            --compilation_level ADVANCED_OPTIMIZATIONS \
            --assume_function_wrapper \
            --emit_use_strict \
            --isolation_mode IIFE \
            --js "$SRC_FOLDER/externs.js" \
            "$SRC_FOLDER/main.js" \
            --js_output_file "$OUTPUT_FILE" \
            2>&1 | tee -a "../$BOOTSTRAP_LOG"

          BOOTSTRAP_EXIT=${PIPESTATUS[0]}

          # --------------------------------------------------------
          # Check result
          # --------------------------------------------------------

          if [ "$BOOTSTRAP_EXIT" -ne 0 ]; then

            {
              echo
              echo "========================================"
              echo "BOOTSTRAP BUILD FAILED"
              echo "========================================"
              echo
              echo "Exit code: $BOOTSTRAP_EXIT"
            } | tee -a "../$BOOTSTRAP_LOG"

            exit "$BOOTSTRAP_EXIT"
          fi

          # --------------------------------------------------------
          # Verify output
          # --------------------------------------------------------

          if [ ! -f "$OUTPUT_FILE" ]; then

            {
              echo
              echo "ERROR: bootstrap.js was not created."
              echo
              echo "Expected:"
              echo "$(pwd)/$OUTPUT_FILE"
              echo
              echo "Contents of javascript_dist:"
              ls -lah javascript_dist || true
            } | tee -a "../$BOOTSTRAP_LOG"

            exit 1
          fi

          {
            echo
            echo "========================================"
            echo "BOOTSTRAP BUILD SUCCESSFUL"
            echo "========================================"
            echo
            echo "Generated bootstrap.js:"
            ls -lh "$OUTPUT_FILE"
            echo
            echo "Bootstrap.js size:"
            wc -c "$OUTPUT_FILE"
          } | tee -a "../$BOOTSTRAP_LOG"

          exit 0

      # ============================================================
      # VERIFY BOOTSTRAP RESULT
      # ============================================================

      - name: Verify bootstrap build
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "BOOTSTRAP BUILD VERIFICATION"
          echo "========================================"

          if [ -f "target_teavm_wasm_gc/javascript_dist/bootstrap.js" ]; then
            echo
            echo "bootstrap.js exists:"
            ls -lh target_teavm_wasm_gc/javascript_dist/bootstrap.js
          else
            echo
            echo "bootstrap.js is missing."
          fi

          echo
          echo "Current WASM distribution:"
          find target_teavm_wasm_gc/javascript_dist \
            -maxdepth 1 \
            -type f \
            -printf '%f (%s bytes)\n' \
            | sort || true

      # ============================================================
      # VERIFY WASM BUILD INPUTS
      # ============================================================

      - name: Verify WASM build inputs
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "WASM BUILD INPUT VERIFICATION"
          echo "========================================"

          echo
          echo "Required bootstrap.js:"
          if [ -f "target_teavm_wasm_gc/javascript_dist/bootstrap.js" ]; then
            ls -lh target_teavm_wasm_gc/javascript_dist/bootstrap.js
          else
            echo "MISSING"
          fi

          echo
          echo "WASM JavaScript directory:"
          find target_teavm_wasm_gc/javascript \
            -maxdepth 1 \
            -type f \
            -printf '%f (%s bytes)\n' \
            | sort || true

          echo
          echo "WASM distribution directory:"
          find target_teavm_wasm_gc/javascript_dist \
            -maxdepth 1 \
            -type f \
            -printf '%f (%s bytes)\n' \
            | sort || true

          echo
          echo "Bootstrap.js verification:"
          if [ -f "target_teavm_wasm_gc/javascript_dist/bootstrap.js" ]; then
            file target_teavm_wasm_gc/javascript_dist/bootstrap.js
          else
            echo "bootstrap.js does not exist."
          fi

      # ============================================================
      # BUILD FULL WASM CLIENT
      # ============================================================

      - name: Build full WASM client
        id: wasm_build
        shell: bash
        run: |
          set +e

          # Always create a completely fresh report.
          rm -f reports/report.txt
          rm -f reports/build.log

          mkdir -p reports

          REPORT="reports/report.txt"
          LOG="reports/build.log"

          {
            echo "========================================"
            echo "Eaglercraft WASM Build Report"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit:     $GITHUB_SHA"
            echo "Branch:     $GITHUB_REF_NAME"
            echo "Run ID:     $GITHUB_RUN_ID"
            echo "Runner OS:  $RUNNER_OS"
            echo "Runner:     $RUNNER_NAME"
            echo "Started:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Build task:"
            echo "  ./gradlew makeMainWasmClientBundle"
            echo
            echo "Bootstrap compiler:"
            echo "  Closure Compiler"
            echo
            echo "Bootstrap source:"
            echo "  src/wasm-gc-teavm-bootstrap/js/main.js"
            echo
            echo "Bootstrap output:"
            echo "  target_teavm_wasm_gc/javascript_dist/bootstrap.js"
            echo
            echo "========================================"
            echo "SYSTEM INFORMATION"
            echo "========================================"
            echo
            echo "Java:"
            java -version 2>&1
            echo
            echo "Gradle:"
            ./gradlew --version
            echo
            echo "Disk space:"
            df -h
            echo
            echo "Memory:"
            free -h || true
            echo
            echo "Working directory:"
            pwd
            echo
            echo "========================================"
            echo "BUILD OUTPUT"
            echo "========================================"
          } > "$REPORT"

          echo "Running Gradle build..."

          ./gradlew makeMainWasmClientBundle \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG"

          BUILD_EXIT=${PIPESTATUS[0]}

          {
            echo
            echo "========================================"
            echo "BUILD RESULT"
            echo "========================================"
          } >> "$REPORT"

          if [ "$BUILD_EXIT" -eq 0 ]; then

            echo "SUCCESS" | tee -a "$REPORT"

          else

            echo "FAILED" | tee -a "$REPORT"
            echo "Gradle exit code: $BUILD_EXIT" | tee -a "$REPORT"

            {
              echo
              echo "========================================"
              echo "ERROR INFORMATION"
              echo "========================================"
              echo
              echo "The Gradle build failed."
              echo
              echo "Gradle exit code:"
              echo "$BUILD_EXIT"
              echo
              echo "Last 300 lines of Gradle output:"
              echo "----------------------------------------"
              tail -n 300 "$LOG" || true
              echo "----------------------------------------"
              echo
              echo "Detected error/failure lines:"
              echo "----------------------------------------"

              grep -Ein \
                'error:|error |failed|failure|exception|caused by:|what went wrong:|execution failed|filenotfound|nosuchfile|outofmemory|java heap|teavm|wasm|webassembly' \
                "$LOG" \
                | tail -n 200 || true

              echo "----------------------------------------"
              echo
              echo "Full Gradle output is available in:"
              echo "reports/build.log"

            } >> "$REPORT"

          fi

          # ========================================================
          # GENERATED ARTIFACTS
          # ========================================================

          {
            echo
            echo "========================================"
            echo "GENERATED ARTIFACTS"
            echo "========================================"
          } >> "$REPORT"

          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then

            find "target_teavm_wasm_gc/javascript_dist" \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort >> "$REPORT"

            ARTIFACT_COUNT=$(find \
              "target_teavm_wasm_gc/javascript_dist" \
              -type f \
              | wc -l)

            {
              echo
              echo "Total generated files: $ARTIFACT_COUNT"
            } >> "$REPORT"

          else

            echo "No WASM output directory was created." >> "$REPORT"

          fi

          # ========================================================
          # FINAL FILE CHECKS
          # ========================================================

          {
            echo
            echo "========================================"
            echo "IMPORTANT FILE CHECKS"
            echo "========================================"

            echo
            echo "bootstrap.js:"
            if [ -f "target_teavm_wasm_gc/javascript_dist/bootstrap.js" ]; then
              ls -lh target_teavm_wasm_gc/javascript_dist/bootstrap.js
            else
              echo "MISSING"
            fi

            echo
            echo "assets.epw:"
            if [ -f "target_teavm_wasm_gc/javascript_dist/assets.epw" ]; then
              ls -lh target_teavm_wasm_gc/javascript_dist/assets.epw
            else
              echo "MISSING"
            fi

            echo
            echo "favicon.png:"
            if [ -f "target_teavm_wasm_gc/javascript_dist/favicon.png" ]; then
              ls -lh target_teavm_wasm_gc/javascript_dist/favicon.png
            else
              echo "MISSING"
            fi

          } >> "$REPORT"

          # ========================================================
          # ENVIRONMENT / PROJECT DIAGNOSTICS
          # ========================================================

          {
            echo
            echo "========================================"
            echo "PROJECT DIAGNOSTICS"
            echo "========================================"

            echo
            echo "Tracked bootstrap-related files:"
            git ls-files | grep -i "bootstrap" || true

            echo
            echo "All bootstrap-related files:"
            find . \
              -type f \
              -iname "*bootstrap*" \
              ! -path "./.git/*" \
              -printf '%p (%s bytes)\n' \
              | sort || true

            echo
            echo "All WASM-related directories:"
            find . \
              -type d \
              \( -iname "*wasm*" -o -iname "*teavm*" \) \
              ! -path "./.git/*" \
              -print \
              | sort || true

            echo
            echo "Git status:"
            git status --short

          } >> "$REPORT"

          {
            echo
            echo "========================================"
            echo "BUILD COMPLETED"
            echo "========================================"
            echo "Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$REPORT"

          # ========================================================
          # PRINT REPORT
          # ========================================================

          echo
          echo "========== BUILD REPORT =========="
          cat "$REPORT"
          echo "=================================="

          exit "$BUILD_EXIT"

      # ============================================================
      # COPY BUILD RESULTS INTO REPOSITORY
      #
      # WASM FILES:
      #
      #   Extras/artifacts/
      #
      # REPORTS:
      #
      #   Extras/errors/
      #
      # This runs even if the build failed.
      # ============================================================

      - name: Prepare repository artifacts and error reports
        if: always()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing repository build output"
          echo "========================================"

          mkdir -p Extras/artifacts
          mkdir -p Extras/errors

          # ========================================================
          # CLEAN OLD REPOSITORY OUTPUT
          # ========================================================

          echo
          echo "Cleaning previous repository artifacts..."

          rm -rf Extras/artifacts/*
          rm -rf Extras/errors/*

          # ========================================================
          # COPY WASM ARTIFACTS
          # ========================================================

          echo
          echo "Copying WASM artifacts..."

          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then

            cp -a \
              target_teavm_wasm_gc/javascript_dist/. \
              Extras/artifacts/

            echo
            echo "Copied artifacts:"

            find Extras/artifacts \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort

          else

            echo "No WASM output directory was created." \
              > Extras/artifacts/BUILD_FAILED.txt

          fi

          # ========================================================
          # COPY REPORTS
          # ========================================================

          echo
          echo "Copying reports..."

          if [ -d "reports" ]; then

            cp -a \
              reports/. \
              Extras/errors/

          else

            echo "No reports directory was generated." \
              > Extras/errors/report.txt

          fi

          # ========================================================
          # GUARANTEE REPORT EXISTS
          # ========================================================

          if [ ! -f "Extras/errors/report.txt" ]; then

            {
              echo "========================================"
              echo "Eaglercraft WASM Build Report"
              echo "========================================"
              echo
              echo "WARNING: The main build report was not generated."
              echo
              echo "Repository: $GITHUB_REPOSITORY"
              echo "Commit:     $GITHUB_SHA"
              echo "Branch:     $GITHUB_REF_NAME"
              echo "Run ID:     $GITHUB_RUN_ID"
              echo "Time:       $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo
              echo "This usually means the workflow failed before"
              echo "the Gradle reporting stage was reached."
            } > Extras/errors/report.txt

          fi

          # ========================================================
          # REPOSITORY BUILD INFORMATION
          # ========================================================

          {
            echo "========================================"
            echo "Repository Build Output"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit:     $GITHUB_SHA"
            echo "Branch:     $GITHUB_REF_NAME"
            echo "Run ID:     $GITHUB_RUN_ID"
            echo "Runner OS:  $RUNNER_OS"
            echo "Finished:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "========================================"
            echo "WASM ARTIFACTS"
            echo "========================================"
            echo

            find Extras/artifacts \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort || true

            echo
            echo "========================================"
            echo "ERROR / REPORT FILES"
            echo "========================================"
            echo

            find Extras/errors \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort || true

          } > Extras/errors/repository-build-info.txt

          # ========================================================
          # DISPLAY FINAL STRUCTURE
          # ========================================================

          echo
          echo "========================================"
          echo "FINAL Extras DIRECTORY"
          echo "========================================"

          find Extras \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

      # ============================================================
      # UPLOAD WASM ARTIFACTS
      #
      # These are ALSO uploaded as GitHub Actions artifacts.
      # ============================================================

      - name: Upload WASM build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-wasm-build-${{ github.sha }}
          path: target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build-diagnostics-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # GITHUB ACTIONS SUMMARY
      # ============================================================

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Eaglercraft WASM Build"
            echo
            echo "## Build Information"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo
            echo "## Repository Output"
            echo
            echo "Generated files are committed to:"
            echo
            echo "- \`Extras/artifacts/\`"
            echo "- \`Extras/errors/\`"
            echo
            echo "## Generated Files"
            echo

            if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then

              find target_teavm_wasm_gc/javascript_dist \
                -type f \
                -printf '%p (%s bytes)\n' \
                | sort

            else

              echo "No output directory."

            fi

            echo
            echo "## Bootstrap"
            echo

            if [ -f "target_teavm_wasm_gc/javascript_dist/bootstrap.js" ]; then

              echo "✅ \`bootstrap.js\` exists."
              echo
              ls -lh target_teavm_wasm_gc/javascript_dist/bootstrap.js

            else

              echo "❌ \`bootstrap.js\` is missing."

            fi

            echo
            echo "## Repository Extras"
            echo

            find Extras \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort || true

            echo
            echo "## Diagnostics"
            echo
            echo "Full logs are available in \`Extras/errors/\`"
            echo "and as the uploaded diagnostic artifact."

          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # COMMIT EVERYTHING TO REPOSITORY
      #
      # This runs even if the build failed.
      #
      # Result:
      #
      #   Extras/artifacts/
      #   Extras/errors/
      #
      # are committed and pushed.
      # ============================================================

      - name: Commit generated WASM files and reports
        if: always()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Commit generated WASM files and reports"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ========================================================
          # DISPLAY OUTPUT
          # ========================================================

          echo
          echo "Repository output:"

          find Extras \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort || true

          echo
          echo "Git status before adding:"
          git status --short

          # ========================================================
          # ADD EVERYTHING UNDER EXTRAS
          #
          # -A includes deletions.
          # -f bypasses .gitignore.
          # ========================================================

          git add -A -f Extras/artifacts Extras/errors

          echo
          echo "Git status after adding:"
          git status --short

          # ========================================================
          # CHECK FOR CHANGES
          # ========================================================

          if git diff --cached --quiet; then

            echo
            echo "No repository output changed."
            exit 0

          fi

          # ========================================================
          # COMMIT
          # ========================================================

          echo
          echo "Creating commit..."

          git commit \
            -m "Build WASM client [skip ci]"

          # ========================================================
          # PUSH
          # ========================================================

          echo
          echo "Pushing generated WASM files and reports..."

          git push origin "HEAD:$GITHUB_REF_NAME"

          echo
          echo "========================================"
          echo "PUSH SUCCESSFUL"
          echo "========================================"

          echo
          echo "Committed directories:"
          echo "  Extras/artifacts/"
          echo "  Extras/errors/"