name: Build Eaglercraft WASM

on:
  push:
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build full WASM client
        run: ./gradlew makeMainWasmClientBundle

      - name: Upload WASM build
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-wasm-build-${{ github.sha }}
          path: target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: error