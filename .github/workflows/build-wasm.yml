name: Build Eaglercraft WASM

on:
  push:
  workflow_dispatch:

# Allow GitHub Actions to commit the report and generated WASM files.
permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build full WASM client
        id: wasm_build
        shell: bash
        run: |
          set +e

          # Always create a completely fresh report.
          rm -f reports/report.txt
          rm -f reports/build.log
          mkdir -p reports

          REPORT="reports/report.txt"
          LOG="reports/build.log"

          {
            echo "========================================"
            echo "Eaglercraft WASM Build Report"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit:     $GITHUB_SHA"
            echo "Branch:     $GITHUB_REF_NAME"
            echo "Run ID:     $GITHUB_RUN_ID"
            echo "Started:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Build task:"
            echo "  ./gradlew makeMainWasmClientBundle"
            echo
            echo "========================================"
            echo "BUILD OUTPUT"
            echo "========================================"
          } > "$REPORT"

          echo "Running Gradle build..."

          ./gradlew makeMainWasmClientBundle 2>&1 | tee "$LOG"
          BUILD_EXIT=${PIPESTATUS[0]}

          {
            echo
            echo "========================================"
            echo "BUILD RESULT"
            echo "========================================"
          } >> "$REPORT"

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "SUCCESS" | tee -a "$REPORT"
          else
            echo "FAILED" | tee -a "$REPORT"
            echo "Gradle exit code: $BUILD_EXIT" | tee -a "$REPORT"

            {
              echo
              echo "========================================"
              echo "ERROR INFORMATION"
              echo "========================================"
              echo
              echo "The Gradle build failed."
              echo
              echo "Gradle exit code:"
              echo "$BUILD_EXIT"
              echo
              echo "Likely error output from the build:"
              echo "----------------------------------------"

              grep -Ei \
                'error:|error |failed|failure|exception|caused by:|what went wrong:|execution failed' \
                "$LOG" | tail -n 100 || true

              echo "----------------------------------------"
              echo
              echo "Full Gradle output is available in:"
              echo "reports/build.log"
            } >> "$REPORT"
          fi

          {
            echo
            echo "========================================"
            echo "GENERATED ARTIFACTS"
            echo "========================================"
          } >> "$REPORT"

          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then

            find "target_teavm_wasm_gc/javascript_dist" \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort >> "$REPORT"

            ARTIFACT_COUNT=$(find "target_teavm_wasm_gc/javascript_dist" -type f | wc -l)

            {
              echo
              echo "Total generated files: $ARTIFACT_COUNT"
            } >> "$REPORT"

          else
            echo "No WASM output directory was created." >> "$REPORT"
          fi

          {
            echo
            echo "========================================"
            echo "BUILD COMPLETED"
            echo "========================================"
            echo "Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$REPORT"

          # Print the report into the GitHub Actions log.
          echo
          echo "========== BUILD REPORT =========="
          cat "$REPORT"
          echo "=================================="

          # Save exit code for later steps.
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          exit "$BUILD_EXIT"

      # Upload the generated WASM as a GitHub Actions artifact.
      - name: Upload WASM build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-wasm-build-${{ github.sha }}
          path: target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: warn

      # Upload the report as a GitHub Actions artifact too.
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.sha }}
          path: reports/
          if-no-files-found: error

      # Commit the report AND generated WASM files back into the repository.
      - name: Commit report and WASM artifacts to repository
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Preparing generated files for commit..."

          # Add the build report.
          git add reports/report.txt

          # Add the generated WASM files if they exist.
          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then
            git add -f target_teavm_wasm_gc/javascript_dist/
          fi

          # Check whether anything actually changed.
          if git diff --cached --quiet; then
            echo "No generated files changed. Nothing to commit."
          else
            echo "Changes detected."

            git status --short

            git commit -m "Update WASM build artifacts [skip ci]"

            echo "Pushing generated files back to repository..."
            git push
          fi